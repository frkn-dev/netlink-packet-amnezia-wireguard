name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  ci:
    name: CI (stable)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install AmneziaWG kernel module (best-effort)
        run: |
          sudo apt update
          sudo apt install -y software-properties-common linux-headers-$(uname -r)
          sudo add-apt-repository -y ppa:amnezia/ppa || true
          sudo apt update || true
          sudo apt install -y amneziawg || true
          sudo modprobe amneziawg || true
          lsmod | grep -i amnezia || true

      - name: Run unit tests
        run: cargo test --lib

      - name: Run integration tests
        # Integration tests need CAP_NET_ADMIN to create amneziawg interfaces.
        run: sudo -E env "PATH=$PATH" cargo test --test integration
